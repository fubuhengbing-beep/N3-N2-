<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ちょこ勉ガチャ</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;600;700&family=Yusei+Magic&display=swap');

*{

  box-sizing:border-box;

}

html,body{

  margin:0;

  min-height:100%;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Maru Gothic ProN",

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    "Meiryo",

    sans-serif;

}

body{

  text-align:center;

  overflow-x:hidden;

  color:#4b3327;

  background:

    radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),

    radial-gradient(circle at 82% 18%,rgba(255,255,255,.7) 0 2px,transparent 3px),

    linear-gradient(

      145deg,

      #f5dfc4 0%,

      #dcae87 38%,

      #536b68 72%,

      #203b49 100%

    );

}

body:before{

  content:"❄️ ✦ ❄️ ✧ 雪 ❄️ ✦ ❄️ 🍂 ❄️ ✧ 雪";

  position:fixed;

  inset:-20px;

  pointer-events:none;

  opacity:.25;

  font-size:24px;

  line-height:3.1;

  letter-spacing:9px;

  transform:rotate(-6deg);

  z-index:0;

  animation:snowFloat 7s ease-in-out infinite alternate;

}

main{

  position:relative;

  z-index:1;

  width:100%;

  max-width:1000px;

  margin:auto;

  padding:20px 12px 60px;

}

.hero{

  background:

    linear-gradient(

      145deg,

      rgba(255,248,238,.97),

      rgba(244,225,201,.94)

    );

  border:3px solid #b87945;

  border-radius:28px;

  padding:20px 14px 18px;

  box-shadow:

    0 12px 35px rgba(45,28,18,.3),

    inset 0 0 0 2px rgba(255,255,255,.6);

}

h1{

  margin:4px 0 8px;

  font-family:

    'Yusei Magic',

    'Kaisei Decol',

    sans-serif;

  font-size:clamp(34px,8vw,55px);

  line-height:1.15;

  color:#8f442f;

  text-shadow:

    0 3px 0 #fff,

    0 0 18px rgba(255,255,255,.8);

}

.sub{

  margin:0;

  font-weight:bold;

  font-size:16px;

}

.winter-deco{

  font-size:30px;

  letter-spacing:8px;

  animation:snowBreathe 2.5s ease-in-out infinite;

}

.winter-message{

  display:inline-block;

  margin-top:10px;

  padding:8px 18px;

  border-radius:999px;

  background:

    linear-gradient(

      90deg,

      #d8edf7,

      #fff,

      #d8edf7

    );

  color:#31566b;

  font-weight:900;

  font-size:15px;

  box-shadow:0 3px 10px #31566b33;

}

/* ガチャマシン */

.gacha-box{

  margin:22px auto 15px;

  width:100%;

  max-width:650px;

  padding:20px 14px;

  border-radius:24px;

  background:

    linear-gradient(#263f4d,#132a37);

  border:3px solid #d9b56d;

  box-shadow:

    0 0 25px rgba(255,218,142,.35),

    inset 0 0 20px #0008;

}

.gacha-machine{

  font-size:clamp(80px,18vw,140px);

  line-height:1;

  display:inline-block;

  filter:

    drop-shadow(0 10px 10px #0008);

}

.gacha-machine.wiggle{

  animation:machine .9s ease;

}

.gacha-label{

  color:#f8dfaa;

  font-weight:bold;

  margin-top:8px;

  letter-spacing:2px;

}

/* ボタン */

.buttons{

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  margin:18px 0;

}

button{

  border:0;

  border-radius:18px;

  padding:16px 24px;

  margin:4px;

  color:#fff;

  font-weight:900;

  font-size:17px;

  cursor:pointer;

  box-shadow:

    0 6px 0 #71361f,

    0 8px 18px #0004;

  transition:.12s;

}

button:active{

  transform:translateY(5px);

  box-shadow:0 1px 0 #71361f;

}

button:disabled{

  opacity:.5;

  cursor:default;

}

.one{

  background:

    linear-gradient(#d9784f,#ae4e31);

}

.ten{

  background:

    linear-gradient(#719bbd,#456f91);

  box-shadow:

    0 6px 0 #304f68,

    0 8px 18px #0004;

}

#loading{

  display:none;

  color:#ffe7ad;

  font-weight:900;

  font-size:25px;

  padding:20px;

  text-shadow:

    0 0 12px #ffd35a;

}

#status{

  min-height:25px;

  color:#fff;

  font-weight:bold;

  text-shadow:0 2px 4px #000;

}

/* 結果タイトル */

.result-title{

  font-family:

    'Yusei Magic',

    sans-serif;

  font-size:32px;

  color:#fff;

  text-shadow:

    0 3px 8px #000;

  margin:24px 0 14px;

}

/* =========================

   先生カード

========================= */

.result-card{

  width:100%;

  max-width:900px;

  margin:18px auto;

  padding:10px;

  border-radius:24px;

  background:#fffaf3;

  box-shadow:

    0 10px 30px rgba(0,0,0,.3);

  animation:

    cardIn .6s cubic-bezier(.2,.9,.3,1.2) both;

}

.result-card img{

  display:block;

  width:100%;

  height:auto;

  max-width:100%;

  margin:0 auto;

  border-radius:18px;

  object-fit:contain;

  box-shadow:

    0 5px 20px rgba(0,0,0,.25);

}

/* iPad以上ではカードをさらに大きく */

@media (min-width:700px){

  main{

    max-width:1100px;

    padding-left:18px;

    padding-right:18px;

  }

  .hero{

    padding:28px 22px;

  }

  .result-card{

    max-width:950px;

    padding:14px;

  }

  .result-card img{

    width:100%;

    max-width:920px;

  }

}

/* 10連 */

.ten-grid{

  display:grid;

  grid-template-columns:

    repeat(2,1fr);

  gap:12px;

  width:100%;

  max-width:1000px;

  margin:auto;

}

.ten-item{

  background:#fffaf3;

  border-radius:18px;

  padding:7px;

  box-shadow:

    0 5px 18px rgba(0,0,0,.25);

  animation:

    cardIn .55s cubic-bezier(.2,.9,.3,1.2) both;

}

.ten-item img{

  display:block;

  width:100%;

  height:auto;

  border-radius:14px;

  object-fit:contain;

}

@media(min-width:700px){

  .ten-grid{

    grid-template-columns:

      repeat(2,1fr);

    gap:18px;

  }

  .ten-item{

    padding:10px;

  }

}

/* もう一回 */

.replay{

  background:

    linear-gradient(#d9784f,#ae4e31);

  margin-top:22px;

}

/* =========================

   UR演出

========================= */

#dark{

  display:none;

  position:fixed;

  inset:0;

  z-index:999;

  overflow:hidden;

  background:

    radial-gradient(

      circle at center,

      #fff7a0 0,

      #8d6500 18%,

      #211600 48%,

      #000 80%

    );

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:#ffd85a;

}

#dark:before{

  content:

    "✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦";

  position:absolute;

  top:12%;

  font-size:30px;

  letter-spacing:10px;

  animation:

    float 1.5s infinite alternate;

}

.urText{

  font-size:

    clamp(120px,32vw,230px);

  font-weight:1000;

  line-height:1;

  text-shadow:

    0 0 12px #fff,

    0 0 35px #ffd700,

    0 0 80px #ff8c00,

    0 0 130px #fff000;

  animation:

    urPop 1.2s cubic-bezier(.15,1.4,.3,1) both;

}

.urSub{

  font-size:

    clamp(20px,5vw,35px);

  color:#fff;

  font-weight:900;

  margin:14px;

  text-shadow:

    0 0 15px #ffd700;

}

#dark button{

  background:#fff;

  color:#222;

  box-shadow:none;

  padding:15px 30px;

}

/* =========================

   ハズレ演出

========================= */

.lose{

  animation:

    loseShake .7s ease;

}

.lose-message{

  font-size:30px;

  font-weight:1000;

  color:#555;

  text-shadow:

    0 2px 4px #fff;

  margin:12px;

}

/* =========================

   アニメーション

========================= */

@keyframes machine{

  0%,100%{

    transform:rotate(0) scale(1);

  }

  15%{

    transform:rotate(-7deg) scale(1.04);

  }

  30%{

    transform:rotate(7deg) scale(1.08);

  }

  45%{

    transform:rotate(-6deg) scale(1.04);

  }

  60%{

    transform:rotate(6deg) scale(1.08);

  }

  75%{

    transform:rotate(-3deg) scale(1.02);

  }

}

@keyframes cardIn{

  from{

    opacity:0;

    transform:

      scale(.65)

      translateY(30px);

  }

  to{

    opacity:1;

    transform:

      scale(1)

      translateY(0);

  }

}

@keyframes urPop{

  0%{

    opacity:0;

    transform:

      scale(.15)

      rotate(-12deg);

  }

  60%{

    transform:

      scale(1.18)

      rotate(3deg);

  }

  100%{

    opacity:1;

    transform:

      scale(1);

  }

}

@keyframes float{

  from{

    transform:translateY(0);

  }

  to{

    transform:translateY(30px);

  }

}

@keyframes snowFloat{

  from{

    transform:

      rotate(-6deg)

      translateY(0);

  }

  to{

    transform:

      rotate(-4deg)

      translateY(10px);

  }

}

@keyframes snowBreathe{

  0%,100%{

    transform:

      translateY(0)

      scale(1);

  }

  50%{

    transform:

      translateY(-4px)

      scale(1.04);

  }

}

@keyframes loseShake{

  0%,100%{

    transform:translateX(0);

  }

  20%{

    transform:translateX(-12px);

  }

  40%{

    transform:translateX(12px);

  }

  60%{

    transform:translateX(-8px);

  }

  80%{

    transform:translateX(8px);

  }

}

</style>

</head>

<body>

<main>

<section class="hero">

  <div class="winter-deco">

    雪️ ❄️ 雪️ ❄️

  </div>

  <h1>

    🍂ちょこ勉ガチャ❄️

  </h1>

  <p class="sub">

    がんばったあなたに、先生からのひとこと！

  </p>

  <div class="winter-message">

    クリスマス 冬のちょこ勉スペシャル クリスマス

  </div>

  <div class="gacha-box">

    <div class="gacha-machine" id="machine">

      🎰

    </div>

    <div class="gacha-label">

      雪 雪の季節のドキドキガチャ 雪

    </div>

  </div>

  <div class="buttons">

    <button

      class="one"

      onclick="g(1)"

    >

      🎯 1回ガチャ

    </button>

    <button

      class="ten"

      onclick="g(10)"

    >

      プレゼント 10連ガチャ

    </button>

  </div>

</section>

<div id="status"></div>

<div id="loading">

  ぴかぴか（新しい） ガチャガチャ……！ ぴかぴか（新しい）

</div>

<div id="out"></div>

</main>

<!-- UR演出 -->

<div id="dark">

  <div class="urText">

    UR

  </div>

  <div class="urSub">

    ぴかぴか（新しい）ぴかぴか（新しい） 超レア！！おめでとう！！ ぴかぴか（新しい）ぴかぴか（新しい）

  </div>

  <button onclick="closeUR()">

    結果を見る

  </button>

</div>

<script>

/* ===================================

   先生データ

=================================== */

const teachers = {

  UR:[

    {

      rarity:"UR",

      name:"今木先生",

      message:"おめでとう🎉",

      /*

        ★ここ重要★

        今木先生のファイル名

      */

      image:"imaki.png"

    }

  ],

  SSR:[

    {

      rarity:"SSR",

      name:"稲田先生",

      message:"勉強、頑張ってね！",

      imageCandidates:[

        "inada.png",

        "inada1.png",

        "inada2.png",

        "稲田先生.png"

      ]

    },

    {

      rarity:"SSR",

      name:"宇野先生",

      message:"体調崩さないでね！",

      imageCandidates:[

        "uno.png",

        "uno.jpg",

        "宇野先生.png",

        "宇野大輔.png"

      ]

    }

  ],

  SR:[

    {

      rarity:"SR",

      name:"瀧川先生",

      message:"勉強、おつかれさま！",

      imageCandidates:[

        "takigawa.png",

        "takigawa.jpg",

        "瀧川先生.png"

      ]

    },

    {

      rarity:"SR",

      name:"新谷先生",

      message:"無理せずにがんばろう！",

      imageCandidates:[

        "shinya.png",

        "shinya.jpg",

        "新谷先生.png"

      ]

    }

  ],

  N:[

    {

      rarity:"N",

      name:"服部先生",

      message:"最後まであきらめない！",

      imageCandidates:[

        "hattori.png",

        "hattori_normal.png",

        "服部先生.png"

      ]

    }

  ],

  X:[

    {

      rarity:"ハズレ",

      name:"服部先生",

      message:"次に期待！",

      imageCandidates:[

        "hattori_lose.png",

        "hattori_lose.jpg",

        "hattori.png",

        "服部先生.png"

      ]

    }

  ]

};

/* ===================================

   音

   iPhone / iPad Safari対応

=================================== */

let audioCtx=null;

/* AudioContextを開始 */

function initAudio(){

  try{

    if(!audioCtx){

      const AC =

        window.AudioContext ||

        window.webkitAudioContext;

      if(AC){

        audioCtx=new AC();

      }

    }

    if(

      audioCtx &&

      audioCtx.state==="suspended"

    ){

      audioCtx.resume();

    }

  }catch(e){}

}

/* 音を鳴らす基本関数 */

function tone(

  frequency,

  duration,

  type="sine",

  volume=.08,

  delay=0

){

  if(!audioCtx)return;

  const osc=

    audioCtx.createOscillator();

  const gain=

    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(

    0,

    audioCtx.currentTime+delay

  );

  gain.gain.linearRampToValueAtTime(

    volume,

    audioCtx.currentTime+delay+.01

  );

  gain.gain.exponentialRampToValueAtTime(

    .001,

    audioCtx.currentTime+delay+duration

  );

  osc.connect(gain);

  gain.connect(audioCtx.destination);

  osc.start(

    audioCtx.currentTime+delay

  );

  osc.stop(

    audioCtx.currentTime+delay+duration+.02

  );

}

/* ガチャを回している音 */

function soundSpin(){

  initAudio();

  if(!audioCtx)return;

  const notes=[

    330,

    392,

    440,

    523,

    392,

    330

  ];

  notes.forEach(

    (n,i)=>{

      tone(

        n,

        .11,

        "square",

        .045,

        i*.12

      );

    }

  );

}

/* 結果発表音 */

function soundResult(){

  initAudio();

  if(!audioCtx)return;

  tone(523,.15,"sine",.08,0);

  tone(659,.15,"sine",.08,.14);

  tone(784,.25,"sine",.10,.28);

}

/* UR専用 */

function soundUR(){

  initAudio();

  if(!audioCtx)return;

  tone(523,.15,"sine",.10,0);

  tone(659,.15,"sine",.10,.13);

  tone(784,.15,"sine",.10,.26);

  tone(1046,.20,"sine",.13,.40);

  tone(1318,.35,"triangle",.14,.58);

}

/* ハズレ音 */

function soundLose(){

  initAudio();

  if(!audioCtx)return;

  tone(

    220,

    .25,

    "sawtooth",

    .07,

    0

  );

  tone(

    165,

    .45,

    "sawtooth",

    .07,

    .25

  );

}

/* ===================================

   DOM

=================================== */

const O=

  document.getElementById("out");

const D=

  document.getElementById("dark");

const L=

  document.getElementById("loading");

const M=

  document.getElementById("machine");

/* ===================================

   ランダム

=================================== */

function pick(array){

  return array[

    Math.floor(

      Math.random()*array.length

    )

  ];

}

/* ===================================

   レア度抽選

=================================== */

function roll(){

  const x=

    Math.random()*100;

  /*

    UR     0.05%

    SSR    10%

    SR     20%

    N      40%

    ハズレ 29.95%

  */

  if(x<0.05){

    return[

      "UR",

      ...Object.values(

        pick(teachers.UR)

      )

    ];

  }

  if(x<10.05){

    return[

      "SSR",

      ...Object.values(

        pick(teachers.SSR)

      )

    ];

  }

  if(x<30.05){

    return[

      "SR",

      ...Object.values(

        pick(teachers.SR)

      )

    ];

  }

  if(x<70.05){

    return[

      "N",

      ...Object.values(

        pick(teachers.N)

      )

    ];

  }

  return[

    "ハズレ",

    ...Object.values(

      pick(teachers.X)

    )

  ];

}

/* ===================================

   ボタンロック

=================================== */

function lock(value){

  document

    .querySelectorAll(

      ".buttons button"

    )

    .forEach(

      b=>b.disabled=value

    );

}

/* ===================================

   画像候補を試す

=================================== */

function imageHTML(item){

  /*

    今木先生は確実に imaki.png

  */

  if(item.image){

    return `

      <img

        src="${item.image}"

        alt="${item.name}"

        loading="eager"

      >

    `;

  }

  /*

    他の先生は候補を順番に試す

  */

  const list=

    item.imageCandidates || [];

  if(list.length===0){

    return "";

  }

  const id=

    "img_"+Math.random()

      .toString(36)

      .substring(2,10);

  return `

    <img

      id="${id}"

      src="${list[0]}"

      alt="${item.name}"

      loading="eager"

      data-candidates='${JSON.stringify(list)}'

      data-index="0"

      onerror="nextImage(this)"

    >

  `;

}

/* 読み込み失敗したら次の名前へ */

function nextImage(img){

  try{

    const list=

      JSON.parse(

        img.dataset.candidates

      );

    let index=

      Number(img.dataset.index)+1;

    if(index<list.length){

      img.dataset.index=index;

      img.src=list[index];

    }else{

      /*

        全部失敗した場合

        画像なしにはせず

        名前を表示

      */

      img.style.display="none";

    }

  }catch(e){}

}

/* ===================================

   ガチャ

=================================== */

function g(n){

  /*

    iPad Safariでは

    ボタンを押した瞬間に

    AudioContextを開始する

  */

  initAudio();

  soundSpin();

  lock(true);

  O.innerHTML="";

  L.style.display="block";

  M.classList.remove("wiggle");

  void M.offsetWidth;

  M.classList.add("wiggle");

  const messages=[

    "ぴかぴか（新しい） ガチャガチャ……！",

    "もみじ 何が出るかな……！",

    "❄️ もうすぐ結果発表……！",

    "🌟 ドキドキ……！"

  ];

  L.textContent=

    messages[

      Math.floor(

        Math.random()*messages.length

      )

    ];

  setTimeout(()=>{

    L.style.display="none";

    let results=[];

    let ur=false;

    for(

      let i=0;

      i<n;

      i++

    ){

      const x=roll();

      if(x[0]==="UR"){

        ur=true;

      }

      results.push(x);

    }

    renderResults(results);

    lock(false);

    if(ur){

      setTimeout(

        ()=>{

          D.style.display="flex";

          soundUR();

        },

        n===1 ? 500 : 1200

      );

    }else{

      soundResult();

      /*

        ハズレなら少し遅れて

        残念音

      */

      if(

        results.some(

          x=>x[0]==="ハズレ"

        )

      ){

        setTimeout(

          soundLose,

          250

        );

      }

    }

  },n===1 ? 1600 : 2200);

}

/* ===================================

   結果表示

=================================== */

function renderResults(results){

  const n=

    results.length;

  let html="";

  html+=

    `<div class="result-title">`+

    (

      n===1

      ?

      "🎉 ガチャ結果！"

      :

      "プレゼント 10連結果！"

    )+

    `</div>`;

  /*

    1回

  */

  if(n===1){

    const x=

      results[0];

    const item=

      findTeacher(

        x[0],

        x[1]

      );

    if(x[0]==="ハズレ"){

      html+=`

        <div class="lose-message">

          げっそり ざ、残念……！！

        </div>

      `;

    }

    html+=`

      <div

        class="result-card ${

          x[0]==="ハズレ"

          ? "lose"

          : ""
