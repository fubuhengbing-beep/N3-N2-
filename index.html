<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>冬のちょこ勉ガチャ</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

*{box-sizing:border-box;}

body{

  margin:0;

  min-height:100vh;

  font-family:"Zen Maru Gothic",sans-serif;

  background:

    radial-gradient(circle at 20% 20%,rgba(255,255,255,.9),transparent 25%),

    radial-gradient(circle at 80% 10%,rgba(255,255,255,.8),transparent 20%),

    linear-gradient(180deg,#bdefff 0%,#eaf9ff 45%,#fff 100%);

  color:#333;

  overflow-x:hidden;

}

.snow{

  position:fixed;

  top:-20px;

  color:white;

  font-size:20px;

  animation:fall linear infinite;

  pointer-events:none;

  z-index:1;

}

@keyframes fall{

  to{

    transform:translateY(110vh) rotate(360deg);

  }

}

.container{

  position:relative;

  z-index:2;

  max-width:1000px;

  margin:auto;

  padding:20px 15px 50px;

  text-align:center;

}

h1{

  margin:8px 0 4px;

  font-size:clamp(32px,8vw,58px);

  font-weight:900;

  color:#176ca8;

  text-shadow:

    3px 3px 0 white,

    0 0 12px rgba(255,255,255,.9);

}

.subtitle{

  font-size:clamp(14px,3vw,20px);

  font-weight:bold;

  color:#39718e;

  margin-bottom:18px;

}

.snowman{

  font-size:70px;

  margin:5px 0;

  animation:bounce 2s infinite;

}

@keyframes bounce{

  0%,100%{transform:translateY(0);}

  50%{transform:translateY(-8px);}

}

.buttons{

  display:flex;

  justify-content:center;

  gap:15px;

  flex-wrap:wrap;

  margin:20px 0 25px;

}

button{

  border:0;

  border-radius:18px;

  padding:15px 30px;

  font-family:inherit;

  font-size:20px;

  font-weight:900;

  cursor:pointer;

  box-shadow:

    0 6px 0 rgba(0,0,0,.15),

    0 8px 20px rgba(0,0,0,.15);

  transition:.15s;

}

button:active{

  transform:translateY(5px);

  box-shadow:0 2px 0 rgba(0,0,0,.15);

}

.one{

  background:linear-gradient(135deg,#fff,#ffe58a);

  color:#a86600;

}

.ten{

  background:linear-gradient(135deg,#fff,#ffb9d7);

  color:#b51c66;

}

.retry{

  background:linear-gradient(135deg,#8eeaff,#5a9cff);

  color:white;

  display:none;

  margin:20px auto;

}

#resultArea{

  display:grid;

  gap:18px;

  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

  margin-top:20px;

}

.card{

  position:relative;

  min-height:350px;

  padding:14px;

  border-radius:25px;

  background:rgba(255,255,255,.9);

  box-shadow:

    0 8px 25px rgba(0,0,0,.18),

    inset 0 0 0 3px rgba(255,255,255,.8);

  overflow:hidden;

  animation:cardIn .5s ease;

}

@keyframes cardIn{

  from{

    opacity:0;

    transform:scale(.7) rotate(-4deg);

  }

  to{

    opacity:1;

    transform:scale(1) rotate(0);

  }

}

.card img{

  width:100%;

  max-height:270px;

  object-fit:cover;

  border-radius:18px;

  display:block;

  background:#eee;

}

.rarity{

  display:inline-block;

  margin:8px 0 3px;

  padding:4px 15px;

  border-radius:30px;

  font-size:16px;

  font-weight:900;

  background:white;

  box-shadow:0 3px 10px rgba(0,0,0,.12);

}

.name{

  font-size:23px;

  font-weight:900;

  margin-top:4px;

}

.message{

  font-size:15px;

  font-weight:bold;

  margin-top:5px;

}

.UR{

  background:radial-gradient(

    circle,

    #fff 0%,

    #fff4a8 30%,

    #ffd45e 70%,

    #ff9d00 100%

  );

  box-shadow:

    0 0 25px #ffd700,

    0 0 55px rgba(255,190,0,.8),

    inset 0 0 0 4px #fff;

}

.UR .rarity{

  background:linear-gradient(90deg,#fff,#ffd700,#fff);

  color:#9b5b00;

  animation:shine 1s infinite alternate;

}

@keyframes shine{

  from{transform:scale(1);}

  to{transform:scale(1.12);}

}

.SSR{

  background:linear-gradient(145deg,#fff,#ffd5ee,#fff);

  box-shadow:0 0 25px rgba(255,90,180,.55);

}

.SR{

  background:linear-gradient(145deg,#fff,#d7efff,#fff);

  box-shadow:0 0 22px rgba(80,170,255,.45);

}

.N{

  background:linear-gradient(145deg,#fff,#e8ffe8,#fff);

}

.LOSE{

  background:linear-gradient(145deg,#ddd,#aaa,#ddd);

  filter:grayscale(.4);

}

.ten-card{

  min-height:250px;

}

.ten-card img{

  max-height:180px;

}

.ten-card .name{

  font-size:18px;

}

.ten-card .message{

  font-size:13px;

}

#darkScreen{

  position:fixed;

  inset:0;

  background:#000;

  z-index:9999;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:white;

}

#darkScreen .urText{

  font-size:clamp(55px,15vw,140px);

  font-weight:900;

  color:#ffd700;

  text-shadow:

    0 0 10px white,

    0 0 30px #ffd700,

    0 0 70px #ff8c00;

  animation:urAppear 1.2s infinite alternate;

}

#darkScreen .smallText{

  margin-top:15px;

  font-size:24px;

  font-weight:bold;

}

@keyframes urAppear{

  from{

    transform:scale(.7);

    opacity:.4;

  }

  to{

    transform:scale(1.1);

    opacity:1;

  }

}

#urFlash{

  position:fixed;

  inset:0;

  background:

    radial-gradient(

      circle,

      #fff 0%,

      #fff5a0 20%,

      #ffd000 45%,

      transparent 70%

    );

  z-index:9998;

  pointer-events:none;

  display:none;

  animation:flash .9s ease-out;

}

@keyframes flash{

  0%{opacity:0;}

  20%{opacity:1;}

  100%{opacity:0;}

}

#loseMessage{

  position:fixed;

  inset:0;

  background:

    radial-gradient(

      circle at center,

      #555 0%,

      #222 40%,

      #050505 100%

    );

  z-index:9997;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:#aaa;

}

#loseMessage .loseBig{

  font-size:clamp(60px,15vw,130px);

  font-weight:900;

  transform:rotate(-8deg);

  animation:loseShake .12s infinite alternate;

}

#loseMessage .loseSmall{

  font-size:22px;

  margin-top:15px;

}

@keyframes loseShake{

  from{

    transform:translateX(-5px) rotate(-8deg);

  }

  to{

    transform:translateX(5px) rotate(-8deg);

  }

}

.note{

  margin-top:25px;

  color:#51809a;

  font-size:13px;

}

</style>

</head>

<body>

<div class="snow" style="left:5%;animation-duration:8s;">❄</div>

<div class="snow" style="left:15%;animation-duration:11s;">❅</div>

<div class="snow" style="left:28%;animation-duration:7s;">❄</div>

<div class="snow" style="left:42%;animation-duration:13s;">❅</div>

<div class="snow" style="left:58%;animation-duration:9s;">❄</div>

<div class="snow" style="left:71%;animation-duration:12s;">❅</div>

<div class="snow" style="left:84%;animation-duration:8s;">❄</div>

<div class="snow" style="left:94%;animation-duration:10s;">❅</div>

<div id="darkScreen">

  <div class="urText">UR……！？</div>

  <div class="smallText">まさか……！！</div>

</div>

<div id="urFlash"></div>

<div id="loseMessage">

  <div class="loseBig">ハズレ…</div>

  <div class="loseSmall">つ、次に期待しよう……。</div>

</div>

<div class="container">

  <div class="snowman">雪</div>

  <h1>冬のちょこ勉ガチャ</h1>

  <div class="subtitle">

    勉強をがんばった君に、先生からのメッセージ！

  </div>

  <div class="buttons">

    <button class="one" onclick="startGacha(1)">

      🎟️ 1回ガチャ

    </button>

    <button class="ten" onclick="startGacha(10)">

      プレゼント 10連ガチャ

    </button>

  </div>

  <div id="resultArea"></div>

  <button id="retry" class="retry" onclick="startGacha(1)">

    🔄 もう一回！

  </button>

  <div class="note">

    京進TOPΣ叡山校

  </div>

</div>

<script>

/* =========================

   ガチャカード設定

========================= */

const cards = [

  {

    name:"今木先生",

    rarity:"UR",

    message:"おめでとう🎉",

    images:["Imaki.png"]

  },

  {

    name:"稲田先生",

    rarity:"SSR",

    message:"勉強、頑張ってね!",

    images:["inada1.jpg","inada2.jpg"]

  },

  {

    name:"宇野先生",

    rarity:"SSR",

    message:"体調崩さないでね!",

    images:["uno.jpg"]

  },

  {

    name:"瀧川先生",

    rarity:"SR",

    message:"勉強、おつかれさま!",

    images:["takigawa.jpg"]

  },

  {

    name:"新谷先生",

    rarity:"SR",

    message:"無理せずにがんばろう!",

    images:["shintani.jpg"]

  },

  {

    name:"服部先生",

    rarity:"N",

    message:"最後まであきらめない!",

    images:["hattaori_nomal.jpg"]

  },

  {

    name:"服部先生",

    rarity:"LOSE",

    message:"次に期待!",

    images:["hattori_lose.png"]

  }

];

/* =========================

   レアリティ抽選

========================= */

function rarityLottery(){

  const r=Math.random()*100;

  if(r<0.05) return "UR";

  if(r<10.05) return "SSR";

  if(r<30.05) return "SR";

  if(r<70.05) return "N";

  return "LOSE";

}

/* =========================

   カード抽選

========================= */

function drawCard(){

  const rarity=rarityLottery();

  const candidates=

    cards.filter(c=>c.rarity===rarity);

  const card=

    candidates[

      Math.floor(Math.random()*candidates.length)

    ];

  const image=

    card.images[

      Math.floor(Math.random()*card.images.length)

    ];

  return {

    ...card,

    image:image

  };

}

/* =========================

   効果音

========================= */

let audioContext;

function getAudio(){

  if(!audioContext){

    audioContext=

      new(window.AudioContext||window.webkitAudioContext)();

  }

  return audioContext;

}

function beep(

  freq,

  duration,

  type="sine",

  volume=.12

){

  try{

    const ctx=getAudio();

    const osc=ctx.createOscillator();

    const gain=ctx.createGain();

    osc.type=type;

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(

      volume,

      ctx.currentTime

    );

    gain.gain.exponentialRampToValueAtTime(

      .001,

      ctx.currentTime+duration

    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(ctx.currentTime+duration);

  }catch(e){}

}

function soundNormal(){

  beep(500,.08);

  setTimeout(

    ()=>beep(700,.1),

    90

  );

}

function soundSSR(){

  beep(600,.08);

  setTimeout(

    ()=>beep(800,.08),

    90

  );

  setTimeout(

    ()=>beep(1000,.15),

    180

  );

}

function soundSR(){

  beep(500,.1);

  setTimeout(

    ()=>beep(700,.12),

    120

  );

}

function soundUR(){

  beep(

    400,

    .12,

    "sawtooth",

    .15

  );

  setTimeout(

    ()=>beep(

      600,

      .12,

      "sawtooth",

      .15

    ),

    120

  );

  setTimeout(

    ()=>beep(

      900,

      .12,

      "sawtooth",

      .15

    ),

    240

  );

  setTimeout(

    ()=>beep(

      1200,

      .25,

      "sawtooth",

      .18

    ),

    360

  );

}

function soundLose(){

  beep(

    220,

    .25,

    "sawtooth",

    .12

  );

  setTimeout(

    ()=>beep(

      130,

      .4,

      "sawtooth",

      .12

    ),

    220

  );

}

/* =========================

   UR演出

========================= */

function showUR(){

  const screen=

    document.getElementById("darkScreen");

  const flash=

    document.getElementById("urFlash");

  screen.style.display="flex";

  soundUR();

  setTimeout(()=>{

    screen.style.display="none";

    flash.style.display="block";

    setTimeout(()=>{

      flash.style.display="none";

    },900);

  },1800);

}

/* =========================

   ハズレ演出

========================= */

function showLose(){

  const lose=

    document.getElementById("loseMessage");

  lose.style.display="flex";

  soundLose();

  setTimeout(()=>{

    lose.style.display="none";

  },1200);

}

/* =========================

   カード表示

========================= */

function createCard(card,ten=false){

  const div=

    document.createElement("div");

  div.className=

    "card "+

    card.rarity+

    (ten?" ten-card":"");

  div.innerHTML=`

    <div class="rarity">

      ${

        card.rarity==="LOSE"

        ?"💀 ハズレ"

        :"⭐ "+card.rarity

      }

    </div>

    <img

      src="${card.image}"

      alt="${card.name}"

      onerror="this.style.display='none'"

    >

    <div class="name">

      ${card.name}

    </div>

    <div class="message">

      ${card.message}

    </div>

  `;

  return div;

}

/* =========================

   ガチャ実行

========================= */

async function startGacha(count){

  const area=

    document.getElementById("resultArea");

  const retry=

    document.getElementById("retry");

  area.innerHTML="";

  retry.style.display="none";

  try{

    const ctx=getAudio();

    if(ctx.state==="suspended"){

      await ctx.resume();

    }

  }catch(e){}

  const results=[];

  for(let i=0;i<count;i++){

    const card=drawCard();

    results.push(card);

    if(count===1){

      if(card.rarity==="UR"){

        showUR();

        await wait(1900);

      }

      else if(card.rarity==="LOSE"){

        showLose();

        await wait(1300);

      }

      else if(card.rarity==="SSR"){

        soundSSR();

        await wait(300);

      }

      else if(card.rarity==="SR"){

        soundSR();

        await wait(250);

      }

      else{

        soundNormal();

        await wait(180);

      }

    }

  }

  if(count===10){

    let hasUR=false;

    results.forEach(card=>{

      if(card.rarity==="UR"){

        hasUR=true;

      }

    });

    if(hasUR){

      showUR();

      await wait(1900);

    }

    else{

      beep(500,.1);

      setTimeout(

        ()=>beep(700,.1),

        100

      );

      await wait(300);

    }

  }

  results.forEach(card=>{

    const element=

      createCard(card,count===10);

    area.appendChild(element);

  });

  retry.style.display="block";

}

function wait(ms){

  return new Promise(

    resolve=>setTimeout(resolve,ms)

  );

}

</script>

</body>

</html>
