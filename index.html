        body {

        }
        .perspective {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card.is-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .card-back {
            transform: rotateY(180deg);
        }
       
        .quiz-option {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .quiz-option.correct {
            background-color: #10B981; 
            border-color: #059669; 
            color: white;
        }
        .quiz-option.incorrect {
            background-color: #EF4444; 
            border-color: #DC2626; 
            color: white;
        }
      
        #mode-toggle:checked ~ .dot {
            transform: translateX(100%);
            background-color: #4f46e5; 
        }
    </style>
</head>

                { kanji: "悩", onyomi: "ノウ", kunyomi: "なや.む", onyomi_romaji: "nō", kunyomi_romaji: "naya.mu", meaning: "be worried, troubled", example_word: "悩む", example_hiragana: "なやむ", example_english: "to be worried" },
                { kanji: "濃", onyomi: "ノウ", kunyomi: "こ.い", onyomi_romaji: "nō", kunyomi_romaji: "ko.i", meaning: "concentrated, dark", example_word: "濃い", example_hiragana: "こい", example_english: "dark, strong" },
                { kanji: "把", onyomi: "ハ", kunyomi: "", onyomi_romaji: "ha", kunyomi_romaji: "", meaning: "grasp, hold", example_word: "把握", example_hiragana: "はあく", example_english: "grasp, understanding" },
                { kanji: "覇", onyomi: "ハ", kunyomi: "", onyomi_romaji: "ha", kunyomi_romaji: "", meaning: "hegemony, supremacy", example_word: "制覇", example_hiragana: "せいは", example_english: "conquest" },
                { kanji: "廃", onyomi: "ハイ", kunyomi: "すた.れる", onyomi_romaji: "hai", kunyomi_romaji: "suta.reru", meaning: "abolish,廃れる", example_word: "廃止", example_hiragana: "はいし", example_english: "abolition" },
                { kanji: "排", onyomi: "ハイ", kunyomi: "", onyomi_romaji: "hai", kunyomi_romaji: "", meaning: "exclude, discharge", example_word: "排出", example_hiragana: "はいしゅつ", example_english: "emission, discharge" },
                { kanji: "杯", onyomi: "ハイ", kunyomi: "さかずき", onyomi_romaji: "hai", kunyomi_romaji: "sakazuki", meaning: "cup, glass", example_word: "乾杯", example_hiragana: "かんぱい", example_english: "cheers!" },
                { kanji: "輩", onyomi: "ハイ", kunyomi: "", onyomi_romaji: "hai", kunyomi_romaji: "", meaning: "comrade, fellow", example_word: "先輩", example_hiragana: "せんぱい", example_english: "senior" },
                { kanji: "培", onyomi: "バイ", kunyomi: "つちか.う", onyomi_romaji: "bai", kunyomi_romaji: "tsuchika.u", meaning: "cultivate, foster", example_word: "栽培", example_hiragana: "さいばい", example_english: "cultivation" },
                { kanji: "媒", onyomi: "バイ", kunyomi: "", onyomi_romaji: "bai", kunyomi_romaji: "", meaning: "mediator", example_word: "媒体", example_hiragana: "ばいたい", example_english: "medium, media" },
                { kanji: "賠", onyomi: "バイ", kunyomi: "", onyomi_romaji: "bai", kunyomi_romaji: "", meaning: "compensate, indemnify", example_word: "賠償", example_hiragana: "ばいしょう", example_english: "compensation" },
                { kanji: "伯", onyomi: "ハク", kunyomi: "", onyomi_romaji: "haku", kunyomi_romaji: "", meaning: "uncle, count", example_word: "伯父", example_hiragana: "おじ", example_english: "uncle" },
                { kanji: "拍", onyomi: "ハク, ヒョウ", kunyomi: "", onyomi_romaji: "haku, hyō", kunyomi_romaji: "", meaning: "clap, beat", example_word: "拍手", example_hiragana: "はくしゅ", example_english: "applause" },
                { kanji: "泊", onyomi: "ハク", kunyomi: "と.まる", onyomi_romaji: "haku", kunyomi_romaji: "to.maru", meaning: "stay overnight", example_word: "宿泊", example_hiragana: "しゅくはく", example_english: "lodging" },
                { kanji: "迫", onyomi: "ハク", kunyomi: "せま.る", onyomi_romaji: "haku", kunyomi_romaji: "sema.ru", meaning: "urge, press", example_word: "圧迫", example_hiragana: "あっぱく", example_english: "pressure, coercion" },
                { kanji: "剝", onyomi: "ハク", kunyomi: "は.がす", onyomi_romaji: "haku", kunyomi_romaji: "ha.gasu", meaning: "peel, come off", example_word: "剥奪", example_hiragana: "はくだつ", example_english: "deprivation" },
                { kanji: "漠", onyomi: "バク", kunyomi: "", onyomi_romaji: "baku", kunyomi_romaji: "", meaning: "vague, desert", example_word: "砂漠", example_hiragana: "さばく", example_english: "desert" },
                { kanji: "爆", onyomi: "バク", kunyomi: "", onyomi_romaji: "baku", kunyomi_romaji: "", meaning: "bomb, explode", example_word: "爆発", example_hiragana: "ばくはつ", example_english: "explosion" },
                { kanji: "縛", onyomi: "バク", kunyomi: "しば.る", onyomi_romaji: "baku", kunyomi_romaji: "shiba.ru", meaning: "tie, bind", example_word: "束縛", example_hiragana: "そくばく", example_english: "restraint, restriction" },
                { kanji: "肌", onyomi: "キ", kunyomi: "はだ", onyomi_romaji: "ki", kunyomi_romaji: "hada", meaning: "skin, texture", example_word: "肌", example_hiragana: "はだ", example_english: "skin" },
                { kanji: "鉢", onyomi: "ハチ", kunyomi: "", onyomi_romaji: "hachi", kunyomi_romaji: "", meaning: "bowl, pot", example_word: "植木鉢", example_hiragana: "うえきばち", example_english: "flowerpot" },
                { kanji: "髪", onyomi: "ハツ", kunyomi: "かみ", onyomi_romaji: "hatsu", kunyomi_romaji: "kami", meaning: "hair", example_word: "髪", example_hiragana: "かみ", example_english: "hair" },
                { kanji: "伐", onyomi: "バツ", kunyomi: "", onyomi_romaji: "batsu", kunyomi_romaji: "", meaning: "cut down, attack", example_word: "伐採", example_hiragana: "ばっさい", example_english: "logging" },
                { kanji: "罰", onyomi: "バツ, バチ", kunyomi: "", onyomi_romaji: "batsu, bachi", kunyomi_romaji: "", meaning: "penalty, punishment", example_word: "罰金", example_hiragana: "ばっきん", example_english: "fine, penalty" },
                { kanji: "閥", onyomi: "バツ", kunyomi: "", onyomi_romaji: "batsu", kunyomi_romaji: "", meaning: "clique, faction", example_word: "財閥", example_hiragana: "ざいばつ", example_english: "zaibatsu, financial clique" },
                { kanji: "氾", onyomi: "ハン", kunyomi: "", onyomi_romaji: "han", kunyomi_romaji: "", meaning: "overflow, spread", example_word: "氾濫", example_hiragana: "はんらん", example_english: "flooding, overflow" },
                { kanji: "藩", onyomi: "ハン", kunyomi: "", onyomi_romaji: "han", kunyomi_romaji: "", meaning: "feudal domain", example_word: "藩", example_hiragana: "はん", example_english: "feudal domain" },
                { kanji: "販", onyomi: "ハン", kunyomi: "", onyomi_romaji: "han", kunyomi_romaji: "", meaning: "sell, trade", example_word: "販売", example_hiragana: "はんばい", example_english: "sales" },
                { kanji: "搬", onyomi: "ハン", kunyomi: "", onyomi_romaji: "han", kunyomi_romaji: "", meaning: "transport, carry", example_word: "運搬", example_hiragana: "うんぱん", example_english: "transport" },
                { kanji: "煩", onyomi: "ハン", kunyomi: "わずら.う", onyomi_romaji: "han", kunyomi_romaji: "wazura.u", meaning: "be troubled, annoy", example_word: "煩雑", example_hiragana: "はんざつ", example_english: "complex, troublesome" },
                { kanji: "頒", onyomi: "ハン", kunyomi: "", onyomi_romaji: "han", kunyomi_romaji: "", meaning: "distribute, proclaim", example_word: "頒布", example_hiragana: "はんぷ", example_english: "distribution" },
                { kanji: "披", onyomi: "ヒ", kunyomi: "", onyomi_romaji: "hi", kunyomi_romaji: "", meaning: "open, reveal", example_word: "披露", example_hiragana: "ひろう", example_english: "announcement, unveiling" },
                { kanji: "扉", onyomi: "ヒ", kunyomi: "とびら", onyomi_romaji: "hi", kunyomi_romaji: "tobira", meaning: "door, title page", example_word: "扉", example_hiragana: "とびら", example_english: "door" },
                { kanji: "罷", onyomi: "ヒ", kunyomi: "や.める", onyomi_romaji: "hi", kunyomi_romaji: "ya.meru", meaning: "quit, stop", example_word: "罷免", example_hiragana: "ひめん", example_english: "dismissal" },
                { kanji: "避", onyomi: "ヒ", kunyomi: "さ.ける", onyomi_romaji: "hi", kunyomi_romaji: "sa.keru", meaning: "avoid, evade", example_word: "避難", example_hiragana: "ひなん", example_english: "evacuation" },
                { kanji: "尾", onyomi: "ビ", kunyomi: "お", onyomi_romaji: "bi", kunyomi_romaji: "o", meaning: "tail, end", example_word: "尾", example_hiragana: "お", example_english: "tail" },
                { kanji: "微", onyomi: "ビ", kunyomi: "", onyomi_romaji: "bi", kunyomi_romaji: "", meaning: "delicate, minute", example_word: "微妙", example_hiragana: "びみょう", example_english: "subtle, delicate" },
                { kanji: "匹", onyomi: "ヒツ", kunyomi: "ひき", onyomi_romaji: "hitsu", kunyomi_romaji: "hiki", meaning: "counter for animals", example_word: "匹敵", example_hiragana: "ひってき", example_english: "to rival, to match" },
                { kanji: "描", onyomi: "ビョウ", kunyomi: "えが.く", onyomi_romaji: "byō", kunyomi_romaji: "ega.ku", meaning: "draw, depict", example_word: "描く", example_hiragana: "えがく", example_english: "to draw" },
                { kanji: "浜", onyomi: "ヒン", kunyomi: "はま", onyomi_romaji: "hin", kunyomi_romaji: "hama", meaning: "beach, seashore", example_word: "横浜", example_hiragana: "よこはま", example_english: "Yokohama" },
                { kanji: "賓", onyomi: "ヒン", kunyomi: "", onyomi_romaji: "hin", kunyomi_romaji: "", meaning: "guest, V.I.P.", example_word: "来賓", example_hiragana: "らいひん", example_english: "guest" },
                { kanji: "頻", onyomi: "ヒン", kunyomi: "", onyomi_romaji: "hin", kunyomi_romaji: "", meaning: "repeatedly, frequently", example_word: "頻繁に", example_hiragana: "ひんぱんに", example_english: "frequently" },
                { kanji: "瓶", onyomi: "ビン", kunyomi: "かめ", onyomi_romaji: "bin", kunyomi_romaji: "kame", meaning: "bottle, jar", example_word: "花瓶", example_hiragana: "かびん", example_english: "vase" }
            ];

            let currentIndex = 0;
            let isFlipped = false;
            let isQuizMode = false;
            let quizScore = 0;
            let quizCurrentIndex = 0;
            let quizOrder = [];
            let flashcardOrder = [];
            let currentCorrectAnswer = '';
            let answerSelected = false;

          
            const flashcardView = document.getElementById('flashcard-view');
            const quizView = document.getElementById('quiz-view');
            const modeToggle = document.getElementById('mode-toggle');
            const flashcardLabel = document.getElementById('flashcard-label');
            const quizLabel = document.getElementById('quiz-label');

            const cardElement = document.querySelector('.card');
            const kanjiCharElement = document.getElementById('kanji-char');
            const kanjiMeaningElement = document.getElementById('kanji-meaning');
            const kanjiOnyomiElement = document.getElementById('kanji-onyomi');
            const kanjiKunyomiElement = document.getElementById('kanji-kunyomi');
            const kanjiOnyomiRomajiElement = document.getElementById('kanji-onyomi-romaji');
            const kanjiKunyomiRomajiElement = document.getElementById('kanji-kunyomi-romaji');
            const kanjiExampleElement = document.getElementById('kanji-example');
            const kanjiExampleEnglishElement = document.getElementById('kanji-example-english');
            const flashcardProgress = document.getElementById('flashcard-progress');

            const quizScoreElement = document.getElementById('quiz-score');
            const quizContent = document.getElementById('quiz-content');
            const finalScoreView = document.getElementById('final-score-view');
            const finalScoreText = document.getElementById('final-score-text');
            const quizWordElement = document.getElementById('quiz-word');
            const quizOptionsElement = document.getElementById('quiz-options');
            const quizProgress = document.getElementById('quiz-progress');

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            function updateView() {
                isQuizMode = modeToggle.checked;
                if (isQuizMode) {
                    flashcardView.classList.add('hidden');
                    quizView.classList.remove('hidden');
                    prevBtn.classList.add('hidden');
                    
                    flashcardLabel.classList.remove('text-indigo-600', 'dark:text-indigo-400');
                    flashcardLabel.classList.add('text-gray-500');
                    quizLabel.classList.add('text-indigo-600', 'dark:text-indigo-400');
                    quizLabel.classList.remove('text-gray-500');
                    startQuiz();
                } else {
                    flashcardView.classList.remove('hidden');
                    quizView.classList.add('hidden');
                    prevBtn.classList.remove('hidden');
                    nextBtn.textContent = 'Next';
                    quizLabel.classList.remove('text-indigo-600', 'dark:text-indigo-400');
                    quizLabel.classList.add('text-gray-500');
                    flashcardLabel.classList.add('text-indigo-600', 'dark:text-indigo-400');
                    flashcardLabel.classList.remove('text-gray-500');
                    renderFlashcard();
                }
            }

            function renderFlashcard() {
                const kanjiIndex = flashcardOrder[currentIndex];
                const currentKanji = kanjiData[kanjiIndex];
                kanjiCharElement.textContent = currentKanji.kanji;
                kanjiMeaningElement.textContent = currentKanji.meaning;
                kanjiOnyomiElement.textContent = currentKanji.onyomi || '-';
                kanjiKunyomiElement.textContent = currentKanji.kunyomi || '-';
                kanjiOnyomiRomajiElement.textContent = currentKanji.onyomi_romaji || '';
                kanjiKunyomiRomajiElement.textContent = currentKanji.kunyomi_romaji || '';
                kanjiExampleElement.textContent = `${currentKanji.example_word} (${currentKanji.example_hiragana})`;
                kanjiExampleEnglishElement.textContent = currentKanji.example_english;
                flashcardProgress.textContent = `Card ${currentIndex + 1} of ${kanjiData.length}`;
                if (cardElement.classList.contains('is-flipped')) {
                    isFlipped = false;
                }
            }

            window.flipCard = () => {
                cardElement.classList.toggle('is-flipped');
                isFlipped = !isFlipped;
            };

            function showNextCard() {
                currentIndex = (currentIndex + 1) % kanjiData.length;
                renderFlashcard();
            }

            function showPrevCard() {
                currentIndex = (currentIndex - 1 + kanjiData.length) % kanjiData.length;
                renderFlashcard();
            }

         
            function startQuiz() {
                quizScore = 0;
                quizCurrentIndex = 0;
                quizOrder = Array.from(Array(kanjiData.length).keys());
                shuffleArray(quizOrder);
                
                quizContent.classList.remove('hidden');
                finalScoreView.classList.add('hidden');
                nextBtn.textContent = 'Next Question';
                
                generateQuizQuestion();
            }

            function showFinalScore() {
                quizContent.classList.add('hidden');
                finalScoreView.classList.remove('hidden');
                quizProgress.textContent = '';
                quizScoreElement.textContent = 'Quiz Finished!';
                finalScoreText.textContent = `Your score: ${quizScore} / ${kanjiData.length}`;
                nextBtn.textContent = 'Restart Quiz';
            }

            function generateQuizQuestion() {
                if (quizCurrentIndex >= quizOrder.length) {
                    showFinalScore();
                    return;
                }

                answerSelected = false;
                updateScoreDisplay();
                
                const correctKanjiIndex = quizOrder[quizCurrentIndex];
                const correctAnswerObject = kanjiData[correctKanjiIndex];
                quizWordElement.textContent = correctAnswerObject.example_word;

                currentCorrectAnswer = `${correctAnswerObject.example_hiragana} (${correctAnswerObject.example_english})`;
                
                const options = [currentCorrectAnswer];
                const usedIndices = [correctKanjiIndex];

                while (options.length < 4) {
                    const distractorIndex = Math.floor(Math.random() * kanjiData.length);
                    if (usedIndices.includes(distractorIndex)) continue;
                    
                    usedIndices.push(distractorIndex);
                    const distractorObject = kanjiData[distractorIndex];
                    const distractorText = `${distractorObject.example_hiragana} (${distractorObject.example_english})`;
                    
                    if (!options.includes(distractorText) && distractorText) {
                        options.push(distractorText);
                    }
                }

                shuffleArray(options);
                quizOptionsElement.innerHTML = '';
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.className = 'quiz-option w-full py-3 px-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg font-semibold border-2 border-transparent text-xs flex items-center justify-center text-center';
                    button.onclick = () => selectAnswer(button);
                    quizOptionsElement.appendChild(button);
                });
            }
            
            function selectAnswer(button) {
                if (answerSelected) return;
                answerSelected = true;
                
                if (button.textContent === currentCorrectAnswer) {
                    quizScore++;
                    button.classList.add('correct');
                } else {
                    button.classList.add('incorrect');
                    Array.from(quizOptionsElement.children).forEach(btn => {
                        if (btn.textContent === currentCorrectAnswer) {
                            btn.classList.add('correct');
                        }
                    });
                }
                updateScoreDisplay();
            }

            function updateScoreDisplay() {
                quizScoreElement.textContent = `Score: ${quizScore}`;
                quizProgress.textContent = `Question ${quizCurrentIndex + 1} of ${kanjiData.length}`;
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            // --- GENERAL EVENT LISTENERS ---
            modeToggle.addEventListener('change', updateView);

            nextBtn.addEventListener('click', () => {
                if (isQuizMode) {
                    if (nextBtn.textContent === 'Restart Quiz') {
                        startQuiz();
                    } else {
                        quizCurrentIndex++;
                        generateQuizQuestion();
                    }
                } else {
                    showNextCard();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (!isQuizMode) {
                    showPrevCard();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' && !isQuizMode) {
                    e.preventDefault();
                    flipCard();
                } else if (!isQuizMode) {
                    if (e.key === 'ArrowRight') showNextCard();
                    if (e.key === 'ArrowLeft') showPrevCard();
                }
            });

        
            flashcardOrder = Array.from(Array(kanjiData.length).keys());
            shuffleArray(flashcardOrder);

            const style = document.createElement('style');
            style.innerHTML = `
                #mode-toggle:checked ~ div .dot {
                    transform: translateX(1.5rem);
                }
            `;
            document.head.appendChild(style);
            updateView();
        });
    </script>
</body>
</html>
