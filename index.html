<!doctype html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>冬のちょこ勉ガチャ</title>

<style>

*{

  box-sizing:border-box;

}

html,body{

  margin:0;

  padding:0;

  min-height:100%;

  font-family:

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    sans-serif;

}

/* =========================

   冬のスタート画面

========================= */

body{

  min-height:100vh;

  overflow-x:hidden;

  background:

    radial-gradient(circle at 50% 15%,

      #ffffff 0%,

      #dff5ff 20%,

      #8ed0ef 48%,

      #4b91c9 75%,

      #214e86 100%);

  color:white;

}

/* 雪の結晶 */

.snowflakes{

  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:0;

}

.snowflake{

  position:absolute;

  top:-50px;

  color:white;

  opacity:.9;

  font-size:24px;

  animation:fall linear infinite;

  text-shadow:

    0 0 8px white,

    0 0 15px #bdefff;

}

@keyframes fall{

  0%{

    transform:translateY(-50px) rotate(0deg);

    opacity:0;

  }

  10%{

    opacity:1;

  }

  100%{

    transform:translateY(110vh) rotate(360deg);

    opacity:.7;

  }

}

/* =========================

   メイン

========================= */

#startScreen{

  position:relative;

  z-index:2;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:25px 15px 45px;

}

.startBox{

  width:min(94vw,760px);

  text-align:center;

  padding:35px 20px 45px;

  border-radius:35px;

  background:

    linear-gradient(

      rgba(255,255,255,.20),

      rgba(255,255,255,.08)

    );

  border:2px solid rgba(255,255,255,.75);

  box-shadow:

    0 0 30px rgba(255,255,255,.45),

    0 20px 60px rgba(0,45,100,.35);

  backdrop-filter:blur(8px);

}

/* 小さな冬タイトル */

.winterSub{

  font-size:clamp(16px,4vw,25px);

  letter-spacing:.18em;

  font-weight:bold;

  text-shadow:0 2px 5px rgba(0,50,100,.5);

}

/* メインタイトル */

.title{

  margin:8px 0 8px;

  font-size:clamp(38px,9vw,76px);

  line-height:1.05;

  font-weight:900;

  color:white;

  text-shadow:

    0 3px 0 #6daed5,

    0 0 10px white,

    0 0 25px #bdefff,

    0 5px 15px rgba(0,60,120,.5);

}

.title span{

  display:block;

  font-size:.58em;

  margin-top:10px;

}

/* 雪だるま */

.snowman{

  font-size:clamp(80px,20vw,150px);

  margin:8px 0 2px;

  filter:

    drop-shadow(0 8px 10px rgba(0,60,120,.35));

  animation:

    snowmanFloat 3s ease-in-out infinite;

}

@keyframes snowmanFloat{

  0%,100%{

    transform:translateY(0) rotate(-2deg);

  }

  50%{

    transform:translateY(-10px) rotate(2deg);

  }

}

/* 説明 */

.startMessage{

  font-size:clamp(14px,3.5vw,21px);

  font-weight:bold;

  line-height:1.7;

  text-shadow:0 2px 4px rgba(0,50,100,.5);

  margin:10px auto 25px;

}

/* ガチャボタン */

.startButton{

  position:relative;

  width:min(90%,520px);

  min-height:80px;

  border:none;

  border-radius:999px;

  font-size:clamp(22px,5vw,34px);

  font-weight:900;

  letter-spacing:.08em;

  color:#24619a;

  background:

    linear-gradient(

      180deg,

      #ffffff 0%,

      #e8faff 45%,

      #b8e8ff 100%

    );

  box-shadow:

    0 8px 0 #5a9dcc,

    0 12px 25px rgba(0,40,100,.4),

    inset 0 2px 8px white;

  cursor:pointer;

  transition:.15s;

}

.startButton:active{

  transform:translateY(7px);

  box-shadow:

    0 2px 0 #5a9dcc,

    0 5px 15px rgba(0,40,100,.3);

}

/* キラキラ */

.sparkle{

  position:absolute;

  font-size:24px;

  animation:sparkle 1.8s ease-in-out infinite;

}

.s1{top:10%;left:8%;}

.s2{top:25%;right:8%;animation-delay:.5s;}

.s3{bottom:20%;left:15%;animation-delay:1s;}

.s4{bottom:15%;right:15%;animation-delay:.3s;}

@keyframes sparkle{

  0%,100%{

    opacity:.3;

    transform:scale(.7) rotate(0);

  }

  50%{

    opacity:1;

    transform:scale(1.3) rotate(25deg);

  }

}

/* =========================

   ガチャ画面

========================= */

#gameScreen{

  display:none;

  position:relative;

  z-index:2;

  min-height:100vh;

  padding:25px 12px 50px;

  text-align:center;

}

.gameTitle{

  font-size:clamp(30px,7vw,52px);

  font-weight:900;

  text-shadow:

    0 0 10px white,

    0 0 25px #bdefff;

}

.buttons{

  display:flex;

  gap:12px;

  justify-content:center;

  flex-wrap:wrap;

  margin:20px auto;

}

.gachaButton{

  border:none;

  border-radius:20px;

  padding:15px 25px;

  font-size:20px;

  font-weight:bold;

  color:#18578d;

  background:white;

  box-shadow:0 5px 0 #75abd0;

}

.gachaButton:active{

  transform:translateY(4px);

  box-shadow:0 1px 0 #75abd0;

}

#results{

  display:grid;

  gap:20px;

  justify-items:center;

}

.resultCard{

  width:min(94vw,850px);

  padding:15px;

  border-radius:25px;

  background:rgba(255,255,255,.92);

  color:#333;

  box-shadow:

    0 10px 30px rgba(0,40,100,.3);

}

.resultCard img{

  display:block;

  width:100%;

  max-width:800px;

  height:auto;

  margin:auto;

  border-radius:18px;

}

.rarity{

  font-size:30px;

  font-weight:900;

  margin:10px;

}

.message{

  font-size:20px;

  font-weight:bold;

}

.ur{

  animation:urFlash 1s infinite alternate;

}

@keyframes urFlash{

  from{

    box-shadow:0 0 20px #fff;

  }

  to{

    box-shadow:

      0 0 50px #fff,

      0 0 90px #9eeaff;

  }

}

.retry{

  margin-top:25px;

  padding:15px 35px;

  border:0;

  border-radius:999px;

  background:white;

  color:#25659b;

  font-size:20px;

  font-weight:bold;

}

/* iPad */

@media (min-width:700px){

  .startBox{

    padding:45px 35px 55px;

  }

  .resultCard{

    max-width:900px;

  }

  .resultCard img{

    max-width:850px;

  }

}

</style>

</head>

<body>

<!-- 雪 -->

<div class="snowflakes">

  <div class="snowflake" style="left:5%;animation-duration:8s;">❄</div>

  <div class="snowflake" style="left:12%;animation-duration:11s;animation-delay:2s;">❅</div>

  <div class="snowflake" style="left:20%;animation-duration:9s;animation-delay:1s;">❄</div>

  <div class="snowflake" style="left:29%;animation-duration:13s;animation-delay:4s;">❆</div>

  <div class="snowflake" style="left:38%;animation-duration:10s;animation-delay:2s;">❄</div>

  <div class="snowflake" style="left:48%;animation-duration:12s;">❅</div>

  <div class="snowflake" style="left:58%;animation-duration:9s;animation-delay:3s;">❄</div>

  <div class="snowflake" style="left:68%;animation-duration:14s;">❆</div>

  <div class="snowflake" style="left:77%;animation-duration:10s;animation-delay:1s;">❄</div>

  <div class="snowflake" style="left:88%;animation-duration:12s;animation-delay:4s;">❅</div>

  <div class="snowflake" style="left:95%;animation-duration:8s;">❄</div>

</div>

<!-- =========================

     スタート

========================= -->

<section id="startScreen">

  <div class="startBox">

    <div class="sparkle s1">✦</div>

    <div class="sparkle s2">✧</div>

    <div class="sparkle s3">✦</div>

    <div class="sparkle s4">✧</div>

    <div class="winterSub">

      ❄️ WINTER SPECIAL ❄️

    </div>

    <div class="title">

      冬の

      <span>ちょこ勉ガチャ</span>

    </div>

    <div class="snowman">

      雪️

    </div>

    <div class="startMessage">

      ❄️ 勉強をがんばったキミへ ❄️<br>

      ドキドキのガチャに挑戦しよう！

    </div>

    <button class="startButton" onclick="startGame()">

      ❄️ ガチャをはじめる！ ❄️

    </button>

  </div>

</section>

<!-- =========================

     ガチャ

========================= -->

<section id="gameScreen">

  <div class="gameTitle">

    ❄️ 冬のちょこ勉ガチャ ❄️

  </div>

  <div class="buttons">

    <button class="gachaButton" onclick="draw(1)">

      プレゼント 1回引く

    </button>

    <button class="gachaButton" onclick="draw(10)">

      プレゼント 10連ガチャ

    </button>

  </div>

  <div id="results"></div>

</section>

<script>

/* =========================

   データ

========================= */

const teachers = {

  UR:[

    {

      rarity:"UR",

      name:"今木先生",

      image:"imaki.png",

      message:"おめでとう🎉"

    }

  ],

  SSR:[

    {

      rarity:"SSR",

      name:"稲田先生",

      image:"inada.png",

      message:"勉強、頑張ってね!"

    },

    {

      rarity:"SSR",

      name:"宇野先生",

      image:"uno.png",

      message:"体調崩さないでね!"

    }

  ],

  SR:[

    {

      rarity:"SR",

      name:"瀧川先生",

      image:"takigawa.png",

      message:"勉強、おつかれさま!"

    },

    {

      rarity:"SR",

      name:"新谷先生",

      image:"shintani.png",

      message:"無理せずにがんばろう!"

    }

  ],

  N:[

    {

      rarity:"N",

      name:"服部先生",

      image:"hattori.png",

      message:"最後まであきらめない!"

    }

  ],

  X:[

    {

      rarity:"ハズレ",

      name:"ハズレ",

      image:"hattori.png",

      message:"次に期待!"

    }

  ]

};

/* =========================

   音

========================= */

let audioCtx=null;

function initAudio(){

  const AC =

    window.AudioContext ||

    window.webkitAudioContext;

  if(!AC) return;

  if(!audioCtx){

    audioCtx=new AC();

  }

  if(audioCtx.state==="suspended"){

    audioCtx.resume();

  }

}

function beep(freq,duration,type="sine"){

  if(!audioCtx) return;

  const osc=audioCtx.createOscillator();

  const gain=audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);

  gain.gain.exponentialRampToValueAtTime(

    .18,

    audioCtx.currentTime+.02

  );

  gain.gain.exponentialRampToValueAtTime(

    .0001,

    audioCtx.currentTime+duration

  );

  osc.connect(gain);

  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(audioCtx.currentTime+duration);

}

function normalSound(){

  beep(600,.12);

  setTimeout(()=>beep(900,.15),100);

}

function urSound(){

  beep(500,.15);

  setTimeout(()=>beep(800,.15),150);

  setTimeout(()=>beep(1200,.25),300);

  setTimeout(()=>beep(1600,.4),500);

}

/* =========================

   抽選

========================= */

function pick(arr){

  return arr[Math.floor(Math.random()*arr.length)];

}

function roll(){

  const r=Math.random()*100;

  // UR 0.05%

  if(r<0.05){

    return pick(teachers.UR);

  }

  // SSR 10%

  if(r<10.05){

    return pick(teachers.SSR);

  }

  // SR 20%

  if(r<30.05){

    return pick(teachers.SR);

  }

  // N 40%

  if(r<70.05){

    return pick(teachers.N);

  }

  // ハズレ 29.95%

  return pick(teachers.X);

}

/* =========================

   スタート

========================= */

function startGame(){

  initAudio();

  beep(800,.12);

  document.getElementById("startScreen").style.display="none";

  document.getElementById("gameScreen").style.display="block";

}

/* =========================

   ガチャ

========================= */

function draw(count){

  initAudio();

  const results=[];

  for(let i=0;i<count;i++){

    results.push(roll());

  }

  renderResults(results);

}

/* =========================

   結果表示

========================= */

function renderResults(results){

  const area=document.getElementById("results");

  area.innerHTML="";

  results.forEach((item,index)=>{

    const card=document.createElement("div");

    card.className="resultCard";

    if(item.rarity==="UR"){

      card.classList.add("ur");

    }

    card.innerHTML=`

      <div class="rarity">

        ${item.rarity==="ハズレ"

          ? "どんっ（衝撃） ハズレ どんっ（衝撃）"

          : "⭐️ "+item.rarity}

      </div>

      <img src="${item.image}" alt="${item.name}">

      <div class="message">

        ${item.message}

      </div>

    `;

    area.appendChild(card);

    if(item.rarity==="UR"){

      setTimeout(urSound,index*150);

    }else{

      setTimeout(normalSound,index*150);

    }

  });

  const retry=document.createElement("button");

  retry.className="retry";

  retry.textContent="❄️ もう一回！ ❄️";

  retry.onclick=()=>{

    draw(results.length===10 ? 10 : 1);

  };

  area.appendChild(retry);

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}

</script>

</body>

</html>
